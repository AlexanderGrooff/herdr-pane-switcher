id = "herdr.pane-switcher"
name = "Pane Switcher"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Cycle panes in MRU order and jump to panes that need attention"
platforms = ["macos", "linux"]

[[build]]
command = ["bash", "herdr/install.sh"]

[[actions]]
id = "cycle"
title = "Cycle MRU panes"
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-mru-cycle\""]

[[actions]]
id = "focus-attention"
title = "Focus first attention pane"
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-mru-cycle\""]

[[actions]]
id = "cycle-attention"
title = "Cycle attention panes"
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-mru-cycle\""]

[[events]]
on = "pane.focused"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-mru-cycle\""]

[[events]]
on = "pane.closed"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-mru-cycle\""]
